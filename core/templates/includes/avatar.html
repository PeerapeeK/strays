{% if photo_url %}
    <img src="{{ photo_url }}" alt="{{ alt }}" class="avatar" width="{{ size }}" height="{{ size }}" style="width: {{ size }}px; height: {{ size }}px;">
{% else %}
    <span class="avatar avatar-initials" style="width: {{ size }}px; height: {{ size }}px; font-size: {{ font_size }}px;" aria-hidden="true">{{ initials }}</span>
{% endif %}
