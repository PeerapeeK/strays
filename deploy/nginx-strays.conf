# StayMatch - served only on loopback; Cloudflare Tunnel connects to it.
server {
    listen 127.0.0.1:8080;
    server_name strays.peerapeek.cc;

    client_max_body_size 25m;

    # Collected Django static files.
    location /static/ {
        alias /srv/strays/staticfiles/;
        access_log off;
        expires 7d;
    }

    # Dog photos are the only public media.
    location /media/dogs/ {
        alias /srv/strays/media/dogs/;
        access_log off;
        expires 7d;
    }

    # Everything else under /media/ stays private.
    location /media/ {
        return 404;
    }

    # Internal target for X-Accel-Redirect responses from Django.
    location /protected/ {
        internal;
        alias /srv/strays/media/;
        add_header Cache-Control "private, max-age=300";
    }

    location / {
        proxy_pass http://unix:/run/strays/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
}
